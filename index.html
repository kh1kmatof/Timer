<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soat va Sekundomer</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/media.css">
</head>

<body>

    <div class="container">
        <div class="soat active">
            <span class="hours">00</span>:<span class="minutes">00</span>:<span class="seconds">00</span>
        </div>

        <div class="timer">
            <div class="time-display">
                <span class="sw-hours">00</span>:<span class="sw-minutes">00</span>:<span
                    class="sw-seconds">00</span>.<span class="sw-ms">00</span>
            </div>
            <div class="sw-controls">
                <button class="btn-sw-main">Start</button>
                <button class="btn-sw-reset ">O'chirish</button>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-soat active">Soat</button>
            <button class="btn-timer">Sekundomer</button>
        </div>
    </div>
    <footer class="footer">
        <p>
            by
            <a href="https://github.com/kh1kmatof" target="_blank" rel="noopener noreferrer" class="brand">
                kh1kmatof
            </a>
        </p>
    </footer>
    <script src="main.js"></script>
</body>

</html>
